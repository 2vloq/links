<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عكس</title>
  <style>
    body {
      margin: 0;
      padding: 40px 16px;
      background: radial-gradient(circle at top, #1f1b12 0%, #0e0e10 100%);
      color: #f4f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .banner-wrap {
      width: 100%;
      max-height: 240px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.35);
      margin-bottom: 18px;
      background: #17171a;
    }
    .banner-wrap img {
      width: 100%;
      height: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }
    .site-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 22px;
      color: #f5d061;
    }
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #17171a;
      border: 1px solid #2b2b30;
      border-radius: 14px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #d4af37;
      background: #1e1e23;
    }
    .right-part {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #27272c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .icon-badge img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .info {
      text-align: right;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
    }
    .handle {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 2px;
      direction: ltr;
      unicode-bidi: isolate;
      text-align: right;
    }
    .arrow {
      font-size: 18px;
      color: #f5d061;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner-wrap">
      <img src="aks.jpg" alt="عكس" onerror="this.style.display='none'" />
    </div>

    <h1 class="site-title">عكس</h1>

    <a class="card" href="https://discord.gg/8kwPRZ5bQ" target="_blank" rel="noopener noreferrer">
      <div class="right-part">
        <div class="icon-badge">
          <img src="https://cdn.simpleicons.org/discord/5865F2" alt="Discord" />
        </div>
        <div class="info">
          <div class="title">Discord</div>
          <div class="handle">discord.gg/8kwPRZ5bQ</div>
        </div>
      </div>
      <div class="arrow">↖</div>
    </a>
  </div>
</body>
</html>
